# Publie Nook Dex pour Windows et Android dans les Releases GitHub.
#
# Se lance tout seul à chaque push sur main :
#  - il lit la version dans package.json (ex. 0.2.0) ;
#  - si la release v0.2.0 existe déjà, il ne fait rien ;
#  - sinon, il compile l'installateur et publie la release (le tag v0.2.0 est créé automatiquement).
# Pour publier une nouvelle version : changer "version" dans package.json, puis commit + push. C'est tout.
# Se lance aussi à la main : onglet Actions → « Publier une version » → Run workflow.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publier: ${{ steps.existe.outputs.publier }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Lire la version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cette version est-elle déjà publiée ?
        id: existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Déjà publiée (et pas un simple brouillon) ? Alors il n'y a rien à faire.
          brouillon=$(gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo "absente")
          if [ "$brouillon" = "false" ]; then
            echo "La version v${{ steps.version.outputs.version }} est déjà publiée : rien à faire."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version v${{ steps.version.outputs.version }} : on publie."
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi

  publier-windows:
    needs: verifier
    if: needs.verifier.outputs.publier == 'oui'
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests automatiques
        run: npm test

      - name: Vérifier les données
        run: npm run verifier

      # On prépare d'abord la release en brouillon : l'installateur, sa « blockmap » et latest.yml
      # (indispensable aux mises à jour automatiques) y sont envoyés, puis on la publie d'un coup.
      - name: Préparer la release (brouillon)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ needs.verifier.outputs.version }}"
          # Texte de la release : la partie « ## <version> » de NOUVEAUTES.md, puis comment installer.
          awk -v titre="## ${{ needs.verifier.outputs.version }}" '$0 == titre { garder = 1; next } /^## / { garder = 0 } garder' NOUVEAUTES.md > notes.md
          [ -s notes.md ] || echo "Nouvelle version de Nook Dex." > notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "Télécharge **Nook-Dex-Setup-${{ needs.verifier.outputs.version }}.exe** pour installer Nook Dex ; s'il est déjà installé, la mise à jour se fait toute seule." >> notes.md
          echo "" >> notes.md
          echo "Sur Android : télécharge **Nook-Dex-Android.apk**, ou ajoute https://github.com/${{ github.repository }} dans **Obtainium** pour recevoir les mises à jour." >> notes.md
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --draft --target "${{ github.sha }}" --title "Nook Dex ${{ needs.verifier.outputs.version }}" --notes-file notes.md

      - name: Compiler et envoyer les fichiers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  # Android : l'APK est construit avec Capacitor (dossier mobile/), signé avec la clé rangée dans les secrets
  # ANDROID_KEYSTORE (fichier .jks en base64) et ANDROID_KEYSTORE_PASSWORD, puis joint à la même release.
  publier-android:
    needs: [verifier, publier-windows]
    if: needs.verifier.outputs.publier == 'oui'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la clé de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Il manque les secrets ANDROID_KEYSTORE et/ou ANDROID_KEYSTORE_PASSWORD (voir LISEZMOI.md, partie Android)."
            exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        working-directory: mobile
        run: |
          npm install
          npm run android

      - name: Compiler l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/nookdex.jks"
          # Le nom (alias) de la clé est lu dans le fichier : pas besoin de le connaître.
          ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/nookdex.jks" -storepass "$KS_PASS" | grep -i -E "PrivateKeyEntry|privatekeyentry" | head -1 | cut -d, -f1)
          [ -n "$ALIAS" ] || { echo "::error::Aucune clé privée dans ANDROID_KEYSTORE"; exit 1; }
          "$BT/zipalign" -p -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/nookdex.jks" --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Nook-Dex-Android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify Nook-Dex-Android.apk
          rm "$RUNNER_TEMP/nookdex.jks"

      - name: Garder une copie dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: Nook-Dex-Android
          path: Nook-Dex-Android.apk

      - name: Ajouter l'APK à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.verifier.outputs.version }}" Nook-Dex-Android.apk --clobber --repo "${{ github.repository }}"

  # La release devient publique quand Windows est prêt, même si Android a échoué (l'APK pourra être ajouté ensuite).
  rendre-publique:
    needs: [verifier, publier-windows, publier-android]
    if: always() && needs.publier-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.verifier.outputs.version }}" --draft=false --latest --repo "${{ github.repository }}"
